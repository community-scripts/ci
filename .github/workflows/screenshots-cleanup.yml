name: Screenshots cleanup

# The `screenshots` branch holds the pictures pr-script-test.yml shows in PR
# and issue comments, as <repository>/<pr|issue>-<number>/. Every run adds a
# commit, and git never forgets a blob, so once a week the branch is replaced
# by a single fresh commit with the folders of open PRs and issues only.
# Closed ones lose their pictures; everything else keeps its URL, because
# the comments link by branch, not by commit.
#
# A report that pushes a screenshot while this runs makes the push fail
# (--force-with-lease); it is retried from the new head, so nothing is lost.

on:
  schedule:
    - cron: "23 3 * * 1" # Monday 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write # this repository only: the screenshots branch

concurrency:
  group: screenshots-cleanup
  cancel-in-progress: false

jobs:
  squash:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Keep open PRs and issues, drop the history
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: screenshots
          # Only these repositories write here; any other folder is dropped.
          SOURCES: "ProxmoxVE DevScripts"
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git ls-remote --exit-code "$url" "refs/heads/${BRANCH}" >/dev/null; then
            echo "No ${BRANCH} branch yet, nothing to do"
            exit 0
          fi
          git init -q work
          cd work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Open or not, asked once per folder. The issues endpoint answers
          # for PRs too. Anything unexpected keeps the folder.
          is_open() {
            local state
            state=$(gh api "repos/${GITHUB_REPOSITORY_OWNER}/$1/issues/$2" --jq .state 2>/dev/null) || {
              [[ "$(gh api -i "repos/${GITHUB_REPOSITORY_OWNER}/$1/issues/$2" 2>/dev/null | head -n1)" == *" 404"* ]] && return 1
              echo "::warning::could not ask about $1#$2, kept"
              return 0
            }
            [[ "$state" == "open" ]]
          }

          for attempt in 1 2 3; do
            git fetch -q --depth 1 "$url" "refs/heads/${BRANCH}"
            old=$(git rev-parse FETCH_HEAD)
            git read-tree --reset FETCH_HEAD
            kept=0 dropped=0
            while IFS= read -r dir; do
              src=${dir%%/*} item=${dir#*/}
              keep=0
              if [[ " $SOURCES " == *" $src "* && "$item" =~ ^(pr|issue)-([0-9]+)$ ]] && is_open "$src" "${BASH_REMATCH[2]}"; then
                keep=1
              fi
              if (( keep )); then
                kept=$((kept + 1))
              else
                git rm -r -q --cached -- "$dir"
                dropped=$((dropped + 1))
              fi
            done < <(git ls-tree -d --name-only FETCH_HEAD | while IFS= read -r top; do
                       git ls-tree -d --name-only "FETCH_HEAD:$top" | sed "s#^#$top/#"
                     done)
            # Loose files and unknown top-level folders: only README.md stays.
            { git ls-files | grep -vE '^(README\.md|[^/]+/(pr|issue)-[0-9]+/.*)$' || true; } | xargs -r git rm -q --cached --
            tree=$(git write-tree)
            new=$(git commit-tree "$tree" -m "Screenshots of open PRs and issues as of $(date -u +%F) (history squashed)")
            if git push -q --force-with-lease="refs/heads/${BRANCH}:${old}" "$url" "${new}:refs/heads/${BRANCH}"; then
              size=$(git cat-file --batch-check='%(objectsize)' < <(git ls-tree -r "$tree" | awk '{print $3}') | awk '{s+=$1} END {printf "%.1f", s/1048576}')
              {
                echo "### Screenshots squashed"
                echo
                echo "Kept ${kept} folder(s) of open PRs and issues, dropped ${dropped}. Branch now ${size} MB in one commit."
              } >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::notice::${BRANCH} moved while squashing (a report pushed); trying again"
            sleep $((attempt * 20))
          done
          echo "::error::${BRANCH} kept moving; try again later"
          exit 1
