name: Screenshots cleanup

# screenshots/ on main holds the pictures pr-script-test.yml shows in PR and
# issue comments, as screenshots/<repository>/<pr|issue>-<number>/. Once a
# week the folders of closed PRs and issues are deleted in one commit, so the
# tree only holds what open ones need. Their pictures disappear from the old
# comments then. History is kept: main also holds the workflows, and is never
# force-pushed.
#
# A report that pushes a screenshot while this runs makes the push fail; it
# is retried on top of the new head.

on:
  schedule:
    - cron: "23 3 * * 1" # Monday 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write # this repository only

concurrency:
  group: screenshots-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Delete screenshots of closed PRs and issues
        env:
          GH_TOKEN: ${{ github.token }}
          # Only these repositories write here; any other folder is dropped.
          SOURCES: "ProxmoxVE DevScripts"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Open or not, asked once per folder. The issues endpoint answers
          # for PRs too. Anything unexpected keeps the folder.
          is_open() {
            local state
            state=$(gh api "repos/${GITHUB_REPOSITORY_OWNER}/$1/issues/$2" --jq .state 2>/dev/null) || {
              [[ "$(gh api -i "repos/${GITHUB_REPOSITORY_OWNER}/$1/issues/$2" 2>/dev/null | head -n1)" == *" 404"* ]] && return 1
              echo "::warning::could not ask about $1#$2, kept"
              return 0
            }
            [[ "$state" == "open" ]]
          }

          [[ -d screenshots ]] || { echo "No screenshots/ yet, nothing to do"; exit 0; }
          kept=0 dropped=0
          while IFS= read -r dir; do
            rel=${dir#screenshots/} src=${rel%%/*} item=${rel#*/}
            if [[ " $SOURCES " == *" $src "* && "$item" =~ ^(pr|issue)-([0-9]+)$ ]] && is_open "$src" "${BASH_REMATCH[2]}"; then
              kept=$((kept + 1))
            else
              git rm -r -q -- "$dir"
              dropped=$((dropped + 1))
            fi
          done < <(find screenshots -mindepth 2 -maxdepth 2 -type d | sort)
          # Loose files under screenshots/ (outside a PR or issue folder) go too.
          { git ls-files screenshots | grep -vE '^screenshots/[^/]+/(pr|issue)-[0-9]+/' || true; } | xargs -r git rm -q --

          if git diff --cached --quiet; then
            echo "Nothing to delete (${kept} open)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -m "Screenshots: delete ${dropped} folder(s) of closed PRs and issues"
          for attempt in 1 2 3; do
            git push -q origin HEAD:main && break
            [[ $attempt == 3 ]] && { echo "::error::main kept moving; try again later"; exit 1; }
            echo "::notice::main moved (a report pushed); rebasing and trying again"
            sleep $((attempt * 10))
            git pull -q --rebase origin main
          done
          size=$(du -sm screenshots 2>/dev/null | cut -f1 || echo 0)
          {
            echo "### Screenshots cleaned up"
            echo
            echo "Kept ${kept} folder(s) of open PRs and issues, deleted ${dropped}. screenshots/ is now about ${size} MB."
          } >>"$GITHUB_STEP_SUMMARY"
